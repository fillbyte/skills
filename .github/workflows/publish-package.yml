name: Publish release package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: ${{ github.repository_owner == 'fillbyte' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@fillbyte"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the released source
        run: npm run verify
      - name: Build release assets
        id: assets
        run: |
          package_name=$(node -p "require('./plugins/ios-capability-architect/package.json').name")
          package_version=$(node -p "require('./plugins/ios-capability-architect/package.json').version")
          test "$package_name" = "@fillbyte/ios-capability-architect"
          test "$package_version" != "0.2.0" || {
            echo "Version 0.2.0 belongs to the legacy package scope; publish a new patch release" >&2
            exit 1
          }
          case "$RELEASE_TAG" in
            "v$package_version"|"ios-capability-architect-v$package_version") ;;
            *) echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2; exit 1 ;;
          esac
          mkdir release-assets
          npm pack --workspace plugins/ios-capability-architect --pack-destination release-assets
          cp "dist/skills-only/ios-capability-architect-skill-$package_version.zip" release-assets/
          cp "dist/skills-only/ios-capability-architect-plugin-$package_version.zip" release-assets/
          npm run --silent release:sbom > "release-assets/ios-capability-architect-$RELEASE_TAG.sbom.cdx.json"
          package_path=$(find release-assets -maxdepth 1 -name '*.tgz' -print -quit)
          {
            printf 'package_path=%s\n' "$package_path"
            printf 'package_name=%s\n' "$package_name"
            printf 'package_version=%s\n' "$package_version"
          } >> "$GITHUB_OUTPUT"
          (cd release-assets && shasum -a 256 ./*.tgz ./*.zip ./*.json > SHA256SUMS)
      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Publish GitHub npm package
        run: |
          if npm view "${{ steps.assets.outputs.package_name }}@${{ steps.assets.outputs.package_version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "GitHub package version already exists; continuing with release assets"
          else
            npm publish "./${{ steps.assets.outputs.package_path }}" --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach package, checksum, and SBOM to the GitHub release
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
